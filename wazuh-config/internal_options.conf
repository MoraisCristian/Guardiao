# Wazuh Internal Configuration

# Logcollector
logcollector.remote_commands=0
logcollector.loop_timeout=2
logcollector.open_attempts=8
logcollector.debug=0
logcollector.max_files=1000

# Remoted
remoted.pass_empty_keyfile=0
remoted.recv_timeout=5
remoted.request_timeout=20
remoted.response_timeout=30
remoted.request_rto_timeout=2
remoted.debug=0

# Analysisd
analysisd.default_timeframe=360
analysisd.stats_interval=360
analysisd.debug=0
analysisd.fts_list_size=32
analysisd.log_fw=1
analysisd.show_hidden_labels=0

# Monitord
monitord.rotate_log=1
monitord.compress=1
monitord.sign=1
monitord.monitor_agents=1
monitord.day_wait=10
monitord.keep_log_days=31
monitord.debug=0

# Integratord
integrator.debug=0

# Database
wazuh_database.interval=60
wazuh_database.max_queued_events=100000
wazuh_db.worker_pool_size=8
wazuh_db.commit_time_ms=500
wazuh_db.commit_time_min=1000
wazuh_db.commit_time_max=1800
wazuh_db.open_db_attempts=5
wazuh_db.open_db_limit=500
wazuh_db.debug=0
wazuh_db.sock_timeout=100000
wazuh_db.max_queued_events=100000
wazuh_db.rlimit_nofile=1024
wazuh_db.fragmentation_threshold=75
wazuh_db.fragmentation_delta=10
wazuh_db.free_pages_percentage=5
wazuh_db.max_fragmentation=85
wazuh_db.check_fragmentation_interval=60

# Execd
execd.max_restart_lock=600
execd.debug=0

# Auth
authd.use_source_ip=0
auth.timeout_seconds=60
auth.use_password=0
auth.force_insert=0
auth.force_time=0
auth.use_source_ip=0
auth.pass_empty_keyfile=0
auth.timeout_seconds=60
auth.timeout_microseconds=10000
auth.debug=0
auth.remote_enrollment=0

# Syscollector
syscollector.debug=0
syscollector.interval=1h
syscollector.network_scan=1
syscollector.packages_scan=1
syscollector.os_scan=1
syscollector.hardware_scan=1
syscollector.ports_scan=1
syscollector.processes_scan=1

# Syscheck
syscheck.debug=0
syscheck.sleep=2
syscheck.sleep_after=15
syscheck.max_eps=100
syscheck.default_max_depth=256

# Rootcheck
rootcheck.sleep=5
rootcheck.debug=0

# Active Response
active-response.debug=0

# Cluster
cluster.debug=0
cluster.debug_level=1
cluster.worker_pool_size=4