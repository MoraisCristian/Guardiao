version: '3.8'

services:
  guardiao:
    image: guardiao
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./apps:/app/apps
    ports:
      - "5002:5000"  # Expõe a API do Flask para o host
    environment:
      - FLASK_APP=app.py
    networks:
      - app-network
      - bw-services

  ossec:
    image: ossec
    build:
      context: .
      dockerfile: ossec-docker/Dockerfile
    ports:
      - "1514:1514/udp"  # Porta para receber logs dos agentes
      - "1515:1515/tcp"  # Porta para comunicação com os agentes
    volumes:
      - ./ossec-data:/root/  # Volume único para persistir dados do OSSEC
    networks:
      - app-network
    environment:
      - API_PASSWORD=sua_senha_secreta  # Senha para proteger a API

  zincsearch:
    image: public.ecr.aws/zinclabs/zincsearch:latest
    ports:
      - "4080:4080"  # Porta padrão do ZincSearch
    volumes:
      - ./zinc-data:/data  # Volume para persistir dados do ZincSearch
    environment:
      - ZINC_FIRST_ADMIN_USER=admin
      - ZINC_FIRST_ADMIN_PASSWORD=#Pascho7095
      - ZINC_DATA_PATH=/data
    networks:
      - app-network
      - bw-services
    restart: unless-stopped

  ossec-to-zinc:
    image: python:3.12-slim
    volumes:
      - ./zincsearch/ossec_to_zincsearch.py:/app/ossec_to_zincsearch.py
      - ./zincsearch/check_zinc.py:/app/check_zinc.py
      - ./zincsearch/ossec_to_zinc.sh:/app/ossec_to_zinc.sh
      - ./ossec-data/alerts.json:/ossec/alerts.json
    command: bash /app/ossec_to_zinc.sh
    networks:
      - app-network
    depends_on:
      - zincsearch
      - ossec

networks:
  app-network:
    driver: bridge
  bw-services:
    external: true
