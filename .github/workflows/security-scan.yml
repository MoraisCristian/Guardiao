name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    name: GitLeaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          scan_args: detect --source . --report-format json --report-path gitleaks-report.json
          github_token: ${{ secrets.GITHUB_TOKEN }}