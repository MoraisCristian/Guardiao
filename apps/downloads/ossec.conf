<ossec_config>
  <client>
    <server-ip>189.84.242.87</server-ip>
    <port>1514</port>
  </client>

  <syscheck>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/etc,/bin,/sbin,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" realtime="no">/var/www,/home</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <auto_ignore>no</auto_ignore>
  </syscheck>

  <rootcheck>
    <rootkit_files>yes</rootkit_files>
    <rootkit_trojans>yes</rootkit_trojans>
    <system_audit>yes</system_audit>
    <system_inventory>yes</system_inventory>
  </rootcheck>

  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/syslog</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/messages</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/apache2/access.log</location>
    <log_format>apache</log_format>
  </localfile>
  <localfile>
    <location>/var/log/apache2/error.log</location>
    <log_format>apache</log_format>
  </localfile>

  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
