# preloaded-vars.conf, Daniel B. Cid (dcid @ ossec.net).
#
# Use este arquivo para personalizar suas instalações.
# Ele fará com que o script install.sh pré-carregue algumas
# opções específicas para rodar automaticamente
# ou com menos perguntas.

# OBSERVAÇÃO:
# Quando usamos "n" ou "y" aqui, ele deve ser alterado
# para "n" ou "y" no idioma em que você está fazendo a
# instalação. Por exemplo, em português seria "s" ou "n".


# USER_LANGUAGE define o idioma a ser usado.
# Pode ser "en", "br", "tr", "it", "de" ou "pl".
# Em caso de idioma inválido, o padrão será o inglês "en".
USER_LANGUAGE="br"     # Para português


# Se USER_NO_STOP for definido como qualquer valor, as mensagens
# de confirmação não serão exibidas.
USER_NO_STOP="s"


# USER_INSTALL_TYPE define o tipo de instalação a
# ser usado durante a instalação. Pode ser apenas "local",
# "agent" ou "server".
USER_INSTALL_TYPE="agent"


# USER_DIR define o local para instalar o OSSEC.
USER_DIR="/var/ossec"


# Se USER_DELETE_DIR for definido como "s", o diretório
# de instalação do OSSEC será removido se existir.
USER_DELETE_DIR="s"


# Se USER_ENABLE_ACTIVE_RESPONSE for definido como "n",
# a resposta ativa será desabilitada.
USER_ENABLE_ACTIVE_RESPONSE="s"


# Se USER_ENABLE_SYSCHECK for definido como "s",
# o syscheck será habilitado. Defina como "n" para
# desabilitá-lo.
USER_ENABLE_SYSCHECK="s"


# Se USER_ENABLE_ROOTCHECK for definido como "s",
# o rootcheck será habilitado. Defina como "n" para
# desabilitá-lo.
USER_ENABLE_ROOTCHECK="s"


### Variáveis de instalação do Agente. ###

# Especifica o endereço IP ou hostname do
# servidor OSSEC. Usado apenas em instalações de agentes.
# Escolha apenas um, não ambos.
USER_AGENT_SERVER_IP="10.0.10.233"  # Substitua pelo IP do servidor OSSEC


# USER_AGENT_CONFIG_PROFILE especifica o nome do perfil de configuração
# do agente. Isso é usado para criar perfis de configuração agent.conf
# para este nome de perfil específico. Usado apenas em instalações de agentes.
# Pode ser qualquer string. Ex.: LinuxDBServer ou WindowsDomainController
USER_AGENT_CONFIG_PROFILE="generic"