<!DOCTYPE html>
<html lang="pt-br" class="dark-theme">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="{{ config.ASSETS_ROOT }}/img/curved-images/guardiao1sf.png">

  <title>
    Guardião Software - {% block title %}{% endblock %}
  </title>

  <!--     Fonts and icons     -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <!-- Nucleo Icons -->
  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-icons.css" rel="stylesheet" />
  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />
  <!-- CSS Files -->
  <link id="pagestyle" href="{{ config.ASSETS_ROOT }}/css/soft-ui-dashboard.css?v=1.0.6" rel="stylesheet" />
  <link id="pagestyle_dark" href="{{ config.ASSETS_ROOT }}/css/dark-theme-core.css" rel="stylesheet" />

  <!-- Global Theme Styles -->
  <style>
    :root {
      --background-color: #344767;
      --text-color: #ffffff;
    }
    
    body {
      background-color: var(--background-color);
      color: var(--text-color);
    }
    
    .light-theme {
      --background-color: #ffffff;
      --text-color: #000000;
    }
    
    /* Apply dark theme to all elements */
    body.dark-theme {
      background-color: var(--background-color);
      color: var(--text-color);
    }
    
    body.dark-theme .card {
      background-color: lighten(#344767, 5%);
      color: var(--text-color);
    }
    
    /* Add other global dark theme styles here */
  </style>

  <!-- Specific CSS goes HERE -->
  {% block stylesheets %}{% endblock stylesheets %}
</head>
<body class="g-sidenav-show dark-theme"> <!-- Added dark-theme class here -->

  {% include "includes/sidebar.html" %}

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    {% include "includes/navigation.html" %}
    {% block content %}{% endblock content %}
  </main>

  <!-- Core JS Files -->
  {% include "includes/scripts.html" %}

  <!-- Specific JS goes HERE -->
  {% block javascripts %}{% endblock javascripts %}

  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>
  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <!-- Control Center for Soft Dashboard: parallax effects, scripts for the example pages etc -->
  <script src="{{ config.ASSETS_ROOT }}/js/soft-ui-dashboard.min.js?v=1.0.6"></script>


</body>

</html>
